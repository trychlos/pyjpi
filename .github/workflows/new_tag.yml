# This workflow runs when a new (non-rc) tag is pushed:
# 1) runs all checks
# 2) publish to TestPyPI
# 3) create a GitHub release with source distributions

name: New tag
run-name: Publishing v${{ github.ref_name }} to test.pyPI.org

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

env:
  VENV: venv

jobs:
  diag:
    uses: ./.github/workflows/_diag.yml

  tests:
    uses: ./.github/workflows/_tests.yml

  check_exists:
    needs:
      - tests
    uses: ./.github/workflows/_check_exists.yml
    with:
      url: "https://test.pypi.org/pypi/$PACKAGE_NAME/json"

  build:
    needs:
      - check_exists
    if: needs.check_exists.outputs.exists == 'false'
    uses: ./.github/workflows/_build.yml
    with:
      path: dist/

  publish:
    name: Publish to TestPyPI
    needs:
      - build
    runs-on: ubuntu-latest
    container: python:3.13-slim
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Get the pre-built distribution
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to TestPyPI
        run: |
          pip install -q uv
          uv venv --seed $VENV
          . $VENV/bin/activate
          uv publish --publish-url https://test.pypi.org/legacy/

  release:
    name: Create GitHub Release
    needs:
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out committed code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Vars (tag & package name)
        id: vars
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "pkg=${{ github.event.repository.name }}-${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
      - name: Create source archives
        run: |
          git archive --format tar.gz --prefix ${{ steps.vars.outputs.pkg }}/ HEAD > ${RUNNER_TEMP}/${{ steps.vars.outputs.pkg }}.tar.gz
          git archive --format zip     --prefix ${{ steps.vars.outputs.pkg }}/ HEAD > ${RUNNER_TEMP}/${{ steps.vars.outputs.pkg }}.zip
          ls -l ${RUNNER_TEMP}/${{ steps.vars.outputs.pkg }}.*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.PAT0 }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "v$TAG" \
            --generate-notes \
            ${RUNNER_TEMP}/${{ steps.vars.outputs.pkg }}.tar.gz \
            ${RUNNER_TEMP}/${{ steps.vars.outputs.pkg }}.zip
          gh workflow run release.yml -f tag="$TAG"
