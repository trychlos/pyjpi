# - execute all defined tests
# - compute (and upload) tests coverage
# - compute code complexity

name: _tests
on:
  workflow_call:

env:
  VENV: venv

permissions:
  contents: write

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out committed code
        uses: actions/checkout@v5
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master

  pytest:
    name: Run pytest
    runs-on: ubuntu-latest
    container: python:3.13-slim
    steps:
      - name: Prepare shell environment (before checkout)
        run: |
          apt update
          apt install -y git
      - name: Checkout the repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Prepare Python environment (after checkout)
        run: |
          pip install -q uv
          uv venv --seed $VENV
          . $VENV/bin/activate
          uv pip install -r requirements.txt -r requirements-test.txt
          uv pip install -e .
      - name: Run pytest
        run: |
          . $VENV/bin/activate
          mkdir -p .github/assets
          pytest --log-level info tests/ --cov=pyjpi
          coverage report --fail-under=85
          coverage xml
      - name: Create Shields endpoint JSON
        run: |
          . $VENV/bin/activate
          mkdir -p .github/assets
          python -c "import xml.etree.ElementTree as ET, json, pathlib; r=ET.parse('coverage.xml').getroot(); pct=round(float(r.attrib.get('line-rate',0.0))*100); color=('green' if pct>=90 else 'yellowgreen' if pct>=75 else 'orange'); pathlib.Path('.github/assets/coverage.json').write_text(json.dumps({'schemaVersion':1,'label':'coverage','message':f'{pct}%','color':color}) + '\n')"
      - name: Commit coverage infos
        run: |
          git config --global --add safe.directory $(pwd)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status
          git add .github/assets/coverage.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "ci: update coverage informations [skip ci]"
            git push
          fi

  complexity:
    name: Complexity (radon)
    needs: pytest
    runs-on: ubuntu-latest
    container: python:3.13-slim
    steps:
      - name: Prepare shell environment (before checkout)
        run: |
          apt update
          apt install -y git
      - name: Checkout the repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Prepare Python environment (after checkout)
        run: |
          pip install -q uv
          uv venv --seed $VENV
          . $VENV/bin/activate
          uv pip install -r requirements.txt -r requirements-test.txt
      - name: Compute Radon complexity
        run: |
          . $VENV/bin/activate
          echo "Showing complexity ≥ 'C'"
          radon cc pyjpi/ tests/ -s -nc --no-assert
          export CCMAX=$(radon cc -s pyjpi/ tests/ | grep -E ' - [A-F] \([0-9]+)' | awk '{ print $5 $6 }' | sort -r | head -1 | sed -e 's|(.*$||')
          echo "CCMAX=$CCMAX"
          mkdir -p .github/assets
          python -c 'import os, json, pathlib; rank = os.environ["CCMAX"].upper(); colors = {"A":"brightgreen","B":"green","C":"yellow","D":"orange","E":"red","F":"critical"}; pathlib.Path(".github/assets/radon.json").write_text(json.dumps({"schemaVersion":1,"label":"CC Max","message":rank,"color":colors.get(rank,"lightgrey")}) + "\n")'
      - name: Commit complexity badge to repo
        run: |
          git config --global --add safe.directory $(pwd)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status
          git add .github/assets/radon.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "ci: update radon informations [skip ci]"
            git push
          fi
